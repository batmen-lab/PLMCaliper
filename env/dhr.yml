# Dense Homolog Retrieval: hydra-driven embedding/aggregation/retrieval.
# Source lives in libs/Dense-Homolog-Retrieval-main (DHR_SRC_DIR), which also
# ships the qjackhmmer binary. faiss and pyarrow are used by build_data.py's
# dhr_aggregate step.
name: dhr
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - faiss-gpu=1.9.0
  - numpy=1.26.4
  - pandas=3.0.2
  - scikit-learn=1.8.0
  - scipy=1.17.1
  - biopython=1.87
  - pyarrow=24.0.0
  - tqdm=4.67.3
  - pip
  - pip:
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - fair-esm==2.0.0
      - transformers==4.48.1
      - datasets==4.8.5
      - pytorch-lightning==2.6.1
      - torchtext==0.18.0
      - einops==0.8.2
      - msgpack-numpy==0.4.8
