# Calibration, FDR, evaluation and plotting -- everything except retrieval.
# Mirrors requirements.txt, plus BLAST+ because run_search.sh -m blastp resolves
# bare `blastp`/`makeblastdb` through this env's bin/ (see src/setup.sh).
name: plmcaliper
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - biopython=1.85
  - clarabel=0.11.1        # the solver PLMCaliper.py actually selects
  - cvxpy=1.8.2
  - matplotlib-base=3.10.8 # every plot script sets the Agg backend
  - numpy=2.4.3
  - pandas=3.0.2
  - patsy=1.0.2
  - scikit-learn=1.8.0
  - scipy=1.17.1
  - tqdm=4.67.3
  - blast=2.17.0           # BLASTp baseline only
